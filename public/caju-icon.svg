  <!-- Shine highlight -->
  <path d="M 36,40 C 34,50 38,68 44,72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Coins / Money symbol inside -->
  <circle cx="52" cy="56" r="12" fill="#2E7D32" opacity="0.9"/>
  <text x="52" y="61" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">R$</text>
